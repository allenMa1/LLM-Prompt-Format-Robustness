[project]
name = "prompt-format-robustness"
version = "0.1.0"
description = "Prompt and output-format robustness experiments for LLM evaluation."
requires-python = ">=3.9"
dependencies = [
  "datasets>=2.19.0",
  "openai>=1.50.0",
  "pandas>=2.0.0",
  "matplotlib>=3.7.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
